name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync UI into embed package
        run: make sync-ui

      - name: Go test
        run: go test ./...

      - name: Build host binary
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}+ci -X main.commit=${GITHUB_SHA::7}" \
            -o bin/docker-visualizer ./cmd/docker-visualizer

      - name: Cross-compile matrix
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          make cross VERSION="$VER" LDFLAGS="-s -w -X main.version=${VER}+ci -X main.commit=${GITHUB_SHA::7}"
